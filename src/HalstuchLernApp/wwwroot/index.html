<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HalstuchLernApp</title>
    <base href="/" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <div class="loading-progress-bar"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ein Fehler ist aufgetreten. Diese Anwendung reagiert möglicherweise nicht mehr.
        <a href="" class="reload">Neu laden</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // GitHub Pages client-side routing support:
        // If the user landed here via 404.html fallback, restore the original path.
        var params = new URLSearchParams(window.location.search);
        var path = params.get('path');
        if (path) {
            var url = window.location.origin + window.location.pathname + path + window.location.hash;
            window.history.replaceState(null, '', url);
        }
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="sw-registrator.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
